
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un item</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
        }
        .card {
            background: #fff;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 20px 35px -8px rgba(0,20,30,0.2);
            width: 100%;
            max-width: 500px;
        }
        h1 { color: #0b2b3c; font-weight: 500; margin-top: 0; }
        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: #1a4b60;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid #cbdae3;
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #0077be;
            box-shadow: 0 0 0 4px rgba(0,119,190,0.15);
        }
        button {
            background: #0077be;
            color: #fff;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 40px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
        }
        button:hover { background: #005f99; }
    </style>
</head>
<body>

<div class="card">
    <h1>🛒 Ajouter un item</h1>

    <!-- Formulaire qui envoie un POST au servlet ListItems -->
    <form action="ListItems" method="POST">
        <label for="newItem">Item</label>
        <input type="text" id="newItem" name="newItem"
               placeholder="ex. Pomme" required>
        <button type="submit">Ajouter</button>
    </form>
</div>

</body>
</html>
