<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion – TP1</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f5f7fb;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 35px -8px rgba(0, 20, 30, 0.2);
            padding: 2rem;
            width: 100%;
            max-width: 500px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 500;
            color: #0b2b3c;
            margin: 0 0 0.3rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .subhead {
            font-size: 0.95rem;
            color: #4c6a7b;
            margin-bottom: 1.8rem;
            border-left: 4px solid #0077be;
            padding-left: 1rem;
            background: #f0f6fa;
            border-radius: 0 8px 8px 0;
            line-height: 1.4;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-bottom: 1.5rem;
        }
        .field label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1a4b60;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .field input[type="text"] {
            padding: 0.85rem 1.2rem;
            border: 1.5px solid #cbdae3;
            border-radius: 14px;
            font-size: 1rem;
            transition: 0.2s;
            background: #fafdff;
            width: 100%;
        }
        .field input[type="text"]:focus {
            outline: none;
            border-color: #0077be;
            box-shadow: 0 0 0 4px rgba(0, 119, 190, 0.15);
            background: #ffffff;
        }
        .btn-primary {
            background: #0077be;
            color: white;
            border: none;
            padding: 0.9rem 2.2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 8px 16px -6px #0077be70;
            width: 100%;
            margin-top: 0.5rem;
        }
        .btn-primary:hover {
            background: #005f99;
            box-shadow: 0 10px 20px -6px #005f99b0;
        }
        .btn-primary:active { transform: scale(0.98); }
        
        .links-section {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px dashed #c5d9e8;
            text-align: center;
        }
        .links-section a {
            color: #0077be;
            text-decoration: none;
            font-weight: 600;
        }
        .links-section a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🔐 Connexion</h1>
    <div class="subhead">
        Entrez votre nom d'utilisateur pour accéder à la liste des items.
    </div>

    <!-- Formulaire POST vers LoginServlet -->
    <form action="LoginServlet" method="post">
        
        <div class="field">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" id="username" name="username" 
                   placeholder="ex. Emma" required>
        </div>

        <button type="submit" class="btn-primary">Se connecter</button>
    </form>

    <div class="links-section">
        <a href="index.html">⬅ Retour à l'accueil</a>
    </div>
</div>

</body>
</html>
