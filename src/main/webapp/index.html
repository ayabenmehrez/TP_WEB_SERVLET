<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire MVC</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f5f7fb; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; border-radius: 24px; padding: 2.5rem; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        h2 { color: #2d3748; }
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { background: #6366f1; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Entrez vos informations</h2>
        <!-- L'action pointe vers le Servlet Controller -->
        <form action="Controller" method="post">
            <input type="text" name="firstName" placeholder="Prénom" required>
            <input type="text" name="lastName" placeholder="Nom" required>
            <input type="text" name="birthDay" placeholder="Date de naissance (mm/dd/yyyy)" required>
            <input type="text" name="sex" placeholder="Sexe (M/F)" required>
            <button type="submit">Envoyer</button>
        </form>
    </div>
</body>
</html>
