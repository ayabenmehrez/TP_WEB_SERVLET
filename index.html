<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST vers Servlet – TP1</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f5f7fb;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 35px -8px rgba(0, 20, 30, 0.2);
            padding: 2rem;
            width: 100%;
            max-width: 650px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 500;
            color: #0b2b3c;
            margin: 0 0 0.3rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .subhead {
            font-size: 0.95rem;
            color: #4c6a7b;
            margin-bottom: 1.8rem;
            border-left: 4px solid #0077be;
            padding-left: 1rem;
            background: #f0f6fa;
            border-radius: 0 8px 8px 0;
            line-height: 1.4;
        }
        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 1.8rem;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .field label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1a4b60;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .field input[type="text"] {
            padding: 0.85rem 1.2rem;
            border: 1.5px solid #cbdae3;
            border-radius: 14px;
            font-size: 1rem;
            transition: 0.2s;
            background: #fafdff;
        }
        .field input[type="text"]:focus {
            outline: none;
            border-color: #0077be;
            box-shadow: 0 0 0 4px rgba(0, 119, 190, 0.15);
            background: #ffffff;
        }
        .radio-group {
            display: flex;
            gap: 2rem;
            padding: 0.5rem 0;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            color: #1a4b60;
            cursor: pointer;
            text-transform: none;
            font-size: 1rem;
        }
        .radio-group input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #0077be;
            cursor: pointer;
        }
        .btn-primary {
            background: #0077be;
            color: white;
            border: none;
            padding: 0.9rem 2.2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 8px 16px -6px #0077be70;
            width: 100%;
        }
        .btn-primary:hover {
            background: #005f99;
            box-shadow: 0 10px 20px -6px #005f99b0;
        }
        .btn-primary:active { transform: scale(0.98); }

        /* ────── Liens vers les autres servlets ────── */
        .links-section {
            margin-top: 2rem;
            padding-top: 1.8rem;
            border-top: 2px dashed #c5d9e8;
        }
        .links-section h2 {
            font-size: 1.1rem;
            font-weight: 500;
            color: #0f3e52;
            margin: 0 0 1rem 0;
            text-align: center;
        }
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.8rem;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.9rem 1.2rem;
            background: #f0f6fa;
            color: #0077be;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.2s;
            border: 1.5px solid #d9e8f2;
            text-align: center;
        }
        .link-btn:hover {
            background: #0077be;
            color: white;
            border-color: #0077be;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px -4px #0077be80;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>📋 POST vers Servlet – TP1</h1>
    <div class="subhead">
        Envoi de <code>firstName</code>, <code>lastName</code>, <code>birthDate</code>
        et <code>sex</code> via <strong>POST</strong> vers <code>FormServlet</code>.
    </div>

    <!-- ============================================================ -->
    <!-- FORMULAIRE : POST vers FormServlet                            -->
    <!-- ============================================================ -->
    <form action="FormServlet" method="post">
        <div class="form-grid">

            <div class="field">
                <label for="firstName">Prénom</label>
                <input type="text" id="firstName" name="firstName"
                       placeholder="ex. Emma" required>
            </div>

            <div class="field">
                <label for="lastName">Nom</label>
                <input type="text" id="lastName" name="lastName"
                       placeholder="ex. Johnson" required>
            </div>

            <div class="field">
                <label for="birthDate">Date de naissance (mm/dd/yyyy)</label>
                <input type="text" id="birthDate" name="birthDate"
                       placeholder="mm/dd/yyyy"
                       pattern="(0[1-9]|1[0-2])/(0[1-9]|[12][0-9]|3[01])/\d{4}"
                       title="Format attendu : mm/dd/yyyy"
                       required>
            </div>

            <div class="field">
                <label>Sexe</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="sex" value="Homme" required>
                        Homme
                    </label>
                    <label>
                        <input type="radio" name="sex" value="Femme" required>
                        Femme
                    </label>
                </div>
            </div>

        </div>

        <button type="submit" class="btn-primary">Envoyer la requête POST</button>
    </form>

    <!-- ============================================================ -->
    <!-- LIENS VERS LES AUTRES SERVLETS                                -->
    <!-- ============================================================ -->
    <div class="links-section">
        <h2>🔗 Autres servlets</h2>
        <div class="links-grid">

            <a href="ReadCookie" class="link-btn">
                🍪 Lire les cookies
            </a>

            <a href="ShowSession" class="link-btn">
                👋 ShowSession
            </a>

            <a href="VisitCounter" class="link-btn">
                🔢 Compteur de visites
            </a>

            <a href="items.html" class="link-btn">
                📝 Liste des items
            </a>

        </div>
    </div>
</div>

</body>
</html>
